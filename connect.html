<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYRECON | Connect Bank</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; display: flex; height: 100vh; }
        .sidebar { width: 250px; background-color: #1e3a8a; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar .logo { font-size: 22px; font-weight: bold; margin-bottom: 40px; }
        .sidebar .logo span { color: #60a5fa; }
        .sidebar a.nav-item { color: #bfdbfe; text-decoration: none; padding: 12px 0; font-size: 16px; border-bottom: 1px solid #1e40af; }
        .sidebar a.nav-item:hover, .sidebar a.nav-item.active { color: #60a5fa; font-weight: bold; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header h1 { font-size: 24px; color: #1e3a8a; margin-bottom: 10px; }
        .header p { color: #666; margin-bottom: 30px; font-size: 14px; }
        .sync-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; max-width: 500px; margin: 0 auto; }
        .sync-icon { font-size: 40px; margin-bottom: 15px; }
        .sync-card h2 { font-size: 18px; color: #1e3a8a; margin-bottom: 10px; }
        .sync-card p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
        .btn-sync { background-color: #10b981; color: white; border: none; padding: 15px 20px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.3s; }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .status-msg { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; display: none; text-align: center; }
        .status-success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; padding: 15px; flex-direction: row; overflow-x: auto; align-items: center; }
            .sidebar .logo { margin-bottom: 0; margin-right: 20px; }
            .sidebar a.nav-item { padding: 0 15px; border-bottom: none; white-space: nowrap; }
            .main-content { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">PAY<span>RECON</span> <br><span style="font-size:12px; font-weight:normal; color:white;">Personal Tracker</span></div>
        <a href="personal.html" class="nav-item">My Overview</a>
        <a href="connect.html" class="nav-item active">Sync Bank Data</a>
        <a href="index.html" class="nav-item">Log Out</a>
    </div>
    <div class="main-content">
        <div class="header" style="text-align: center;">
            <h1>Import Bank Statement</h1>
            <p>Upload your Excel or CSV file. We will find the exact Amount column.</p>
        </div>
        
        <div class="sync-card">
            <div class="sync-icon">📊</div>
            <h2>Select Bank File</h2>
            <div class="file-upload-wrapper">
                <button class="btn-sync">Choose Excel/CSV File</button>
                <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" onchange="handleFileUpload(event)">
            </div>
            <div id="statusMsg" class="status-msg"></div>
        </div>
    </div>

    <script>
        function showStatus(text, type) {
            let el = document.getElementById('statusMsg');
            el.textContent = text; el.className = 'status-msg status-' + type; el.style.display = 'block';
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                // Read as array of arrays
                const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                processData(rows);
            };
            reader.readAsArrayBuffer(file);
        }

        function processData(rows) {
            let newTransactions = [];
            
            // Find the header row by looking for keywords
            let headerRowIndex = -1;
            let dateCol = -1, descCol = -1, amountCol = -1, debitCol = -1, creditCol = -1;

            for (let i = 0; i < Math.min(rows.length, 15); i++) {
                let row = rows[i].map(cell => String(cell).toLowerCase());
                
                // Look for date column
                let dIdx = row.findIndex(c => c.includes('date'));
                if (dIdx !== -1) {
                    headerRowIndex = i;
                    dateCol = dIdx;
                    
                    // Find description
                    descCol = row.findIndex(c => c.includes('desc') || c.includes('narr') || c.includes('detail') || c.includes('remark'));
                    
                    // Find amount (either single column, or split into debit/credit)
                    amountCol = row.findIndex(c => c.includes('amount') || c.includes('value'));
                    debitCol = row.findIndex(c => c.includes('debit') || c.includes('withdraw'));
                    creditCol = row.findIndex(c => c.includes('credit') || c.includes('deposit'));
                    
                    break;
                }
            }

            // If we couldn't find a header, fall back to assuming column 0 is date, 1 is desc, 2 is amount
            if (headerRowIndex === -1) {
                headerRowIndex = 0;
                dateCol = 0; descCol = 1; amountCol = 2;
            }

            // Loop through rows starting AFTER the header
            for (let i = headerRowIndex + 1; i < rows.length; i++) {
                let row = rows[i];
                if (!row || row.length === 0) continue;

                let date = row[dateCol];
                let desc = row[descCol] || "Bank Transaction";
                
                if (!date) continue; // Skip empty rows

                let amount = 0;

                // If we found Debit/Credit columns
                if (debitCol !== -1 || creditCol !== -1) {
                    let debit = parseFloat(String(row[debitCol] || "").replace(/[^0-9.-]+/g,""));
                    let credit = parseFloat(String(row[creditCol] || "").replace(/[^0-9.-]+/g,""));
                    
                    if (!isNaN(debit) && debit > 0) amount = -debit;
                    else if (!isNaN(credit) && credit > 0) amount = credit;
                } 
                // If we found a single Amount column
                else if (amountCol !== -1) {
                    let amtStr = String(row[amountCol] || "");
                    // Check if it has a minus sign or DR/CR
                    let isDebit = amtStr.includes('-') || amtStr.toLowerCase().includes('dr');
                    amount = parseFloat(amtStr.replace(/[^0-9.-]+/g,""));
                    if (isDebit && amount > 0) amount = -amount;
                }

                // Ignore if amount is zero, NaN, or suspiciously large (like an account number)
                if (isNaN(amount) || amount === 0 || Math.abs(amount) > 100000000) continue;

                // Categorize
                let lowerDesc = String(desc).toLowerCase();
                let category = "Shopping";
                if (lowerDesc.includes('uber') || lowerDesc.includes('bolt')) category = "Transport";
                if (lowerDesc.includes('food') || lowerDesc.includes('market')) category = "Food";
                if (amount > 0) category = "Income";

                // Assign icon based on description
                let providerName = "Bank";
                let providerColor = "#64748b";
                let providerInitial = "BK";
                
                if (lowerDesc.includes('opay')) { providerName = "OPay"; providerColor = "#00b875"; providerInitial = "OP"; }
                else if (lowerDesc.includes('kuda')) { providerName = "Kuda"; providerColor = "#4b5563"; providerInitial = "KU"; }
                else if (lowerDesc.includes('gtb') || lowerDesc.includes('guaranty')) { providerName = "GTB"; providerColor = "#f59e0b"; providerInitial = "GT"; }
                else if (lowerDesc.includes('access')) { providerName = "Access"; providerColor = "#1d4ed8"; providerInitial = "AC"; }

                newTransactions.push({
                    date: String(date),
                    providerName: providerName,
                    providerColor: providerColor,
                    providerInitial: providerInitial,
                    desc: String(desc),
                    amount: amount,
                    category: category
                });
            }

            if (newTransactions.length > 0) {
                showStatus(`Successfully found ${newTransactions.length} transactions! Redirecting...`, "success");
                let existing = JSON.parse(localStorage.getItem('payrecon_data_v3')) || [];
                let combined = [...newTransactions, ...existing];
                localStorage.setItem('payrecon_data_v3', JSON.stringify(combined));
                setTimeout(() => { window.location.href = "personal.html"; }, 2000);
            } else {
                alert("Could not find valid transactions. Please check that your file has columns for Date, Description, and Amount.");
            }
        }
    </script>
</body>
</html>
