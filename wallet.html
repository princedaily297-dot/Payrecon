<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYRECON | Wallet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; display: flex; height: 100vh; }
        
        .sidebar { width: 250px; background-color: #1e3a8a; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar .logo { font-size: 22px; font-weight: bold; margin-bottom: 40px; }
        .sidebar .logo span { color: #60a5fa; }
        .sidebar a.nav-item { color: #bfdbfe; text-decoration: none; padding: 12px 0; font-size: 16px; border-bottom: 1px solid #1e40af; }
        .sidebar a.nav-item:hover, .sidebar a.nav-item.active { color: #60a5fa; font-weight: bold; }
        
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; color: #1e3a8a; }
        .btn-reset { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 4px solid #3b82f6; }
        .stat-card h3 { font-size: 14px; color: #666; margin-bottom: 10px; }
        .stat-card p { font-size: 24px; font-weight: bold; color: #1e3a8a; }

        .analytics-section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .analytics-section h2 { font-size: 18px; color: #1e3a8a; margin-bottom: 15px; }
        .bar-chart { display: flex; flex-direction: column; gap: 15px; }
        .bar-item { display: flex; flex-direction: column; gap: 5px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: #555; }
        .bar-track { width: 100%; height: 12px; background-color: #e2e8f0; border-radius: 6px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease-in-out; }

        .feed-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .txn-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .txn-card { display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; }
        .txn-left { display: flex; align-items: center; gap: 15px; }
        .provider-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 13px; }
        .txn-info h4 { font-size: 16px; color: #1e293b; margin-bottom: 4px; }
        .txn-info p { font-size: 12px; color: #64748b; }
        .txn-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .txn-amount { font-size: 16px; font-weight: bold; }
        .btn-receipt { background: none; border: 1px solid #cbd5e1; color: #475569; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .receipt-box { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 12px; text-align: center; }
        .receipt-box h2 { color: #1e3a8a; margin-bottom: 5px; }
        .receipt-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #e2e8f0; font-size: 14px; }
        .receipt-total { display: flex; justify-content: space-between; padding: 15px 0; font-size: 18px; font-weight: bold; color: #1e3a8a; margin-top: 10px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-print { flex: 1; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-close { flex: 1; padding: 12px; background: #e2e8f0; color: #475569; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; padding: 15px; flex-direction: row; overflow-x: auto; align-items: center; }
            .sidebar .logo { margin-bottom: 0; margin-right: 20px; }
            .sidebar a.nav-item { padding: 0 15px; border-bottom: none; white-space: nowrap; }
            .main-content { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">PAY<span>RECON</span></div>
        <a href="#" class="nav-item active">My Overview</a>
        <a href="sync.html" class="nav-item">Sync Bank Data</a>
        <a href="index.html" class="nav-item">Log Out</a>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1>My Wallet</h1>
            <button onclick="clearData()" class="btn-reset">Reset Data</button>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card" style="border-left-color: #10b981;"><h3>Money In</h3><p id="moneyIn" style="color: #10b981;">₦0.00</p></div>
            <div class="stat-card" style="border-left-color: #ef4444;"><h3>Money Out</h3><p id="moneyOut" style="color: #ef4444;">₦0.00</p></div>
        </div>

        <div class="analytics-section">
            <h2>How Your Money Was Spent</h2>
            <div class="bar-chart" id="chartContainer">
                <!-- Bars injected by JS -->
            </div>
        </div>

        <div class="feed-container">
            <h2>Recent Activity</h2>
            <div class="txn-list" id="feed"></div>
        </div>
    </div>

    <div class="modal-overlay" id="receiptModal">
        <div class="receipt-box">
            <h2>PAYRECON RECEIPT</h2>
            <div class="receipt-row"><span>Date</span><span id="rcptDate"></span></div>
            <div class="receipt-row"><span>Type</span><span id="rcptType"></span></div>
            <div class="receipt-row"><span>Details</span><span id="rcptName"></span></div>
            <div class="receipt-row"><span>Bank</span><span id="rcptBank"></span></div>
            <div class="receipt-total"><span>Total</span><span id="rcptAmount"></span></div>
            <div class="modal-actions">
                <button class="btn-close" onclick="document.getElementById('receiptModal').style.display='none'">Close</button>
                <button class="btn-print" onclick="window.print()">Save / Print</button>
            </div>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('payrecon_data_v3')) || [];

        function clearData() {
            if (confirm("Clear all data?")) {
                localStorage.removeItem('payrecon_data_v3');
                location.reload();
            }
        }

        function render() {
            let moneyIn = 0, moneyOut = 0;
            let categories = {};

            transactions.forEach(t => {
                if (t.amount > 0) {
                    moneyIn += t.amount;
                } else {
                    moneyOut += Math.abs(t.amount);
                    if (!categories[t.category]) categories[t.category] = 0;
                    categories[t.category] += Math.abs(t.amount);
                }
            });

            document.getElementById('moneyIn').textContent = "+ ₦" + moneyIn.toLocaleString();
            document.getElementById('moneyOut').textContent = "- ₦" + moneyOut.toLocaleString();

            let chartContainer = document.getElementById('chartContainer');
            chartContainer.innerHTML = '';
            const colors = { Food: "#ef4444", Transport: "#f59e0b", Bills: "#3b82f6", Shopping: "#8b5cf6", Income: "#10b981" };
            let totalSpend = moneyOut > 0 ? moneyOut : 1;

            if (Object.keys(categories).length === 0) {
                chartContainer.innerHTML = '<p style="color:#64748b; font-size:14px;">No spending data yet.</p>';
            } else {
                for (let cat in categories) {
                    let percentage = (categories[cat] / totalSpend) * 100;
                    let color = colors[cat] || "#64748b";
                    chartContainer.innerHTML += `
                        <div class="bar-item">
                            <div class="bar-label"><span>${cat}</span><span>₦${categories[cat].toLocaleString()} (${percentage.toFixed(0)}%)</span></div>
                            <div class="bar-track"><div class="bar-fill" style="width: ${percentage}%; background-color: ${color};"></div></div>
                        </div>
                    `;
                }
            }

            let feed = document.getElementById('feed');
            feed.innerHTML = transactions.length === 0 ? '<p style="color:#64748b;">No transactions. Click "Sync Bank Data".</p>' : '';
            
            transactions.forEach((t, index) => {
                let isInc = t.amount >= 0;
                let sign = isInc ? "+" : "-";
                let color = isInc ? "#10b981" : "#ef4444";
                let title = isInc ? "Received from" : "Transfer to";
                
                feed.innerHTML += `
                    <div class="txn-card">
                        <div class="txn-left">
                            <div class="provider-icon" style="background-color: ${t.providerColor || '#64748b'}">${t.providerInitial || 'BK'}</div>
                            <div class="txn-info">
                                <h4>${title} ${t.name}</h4>
                                <p>${t.date} • ${t.bank}</p>
                            </div>
                        </div>
                        <div class="txn-right">
                            <div class="txn-amount" style="color: ${color}">${sign}₦${Math.abs(t.amount).toLocaleString()}</div>
                            <button class="btn-receipt" onclick="showReceipt(${index})">🧾 Receipt</button>
                        </div>
                    </div>
                `;
            });
        }

        function showReceipt(index) {
            let t = transactions[index];
            document.getElementById('rcptDate').textContent = t.date;
            document.getElementById('rcptType').textContent = t.amount >= 0 ? "Credit" : "Debit";
            document.getElementById('rcptName').textContent = t.name;
            document.getElementById('rcptBank').textContent = t.bank;
            document.getElementById('rcptAmount').textContent = "₦" + Math.abs(t.amount).toLocaleString();
            document.getElementById('receiptModal').style.display = 'flex';
        }

        render();
    </script>
</body>
</html>
